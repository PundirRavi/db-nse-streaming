# This is a Databricks asset bundle definition for setup_client.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: db_nse_streaming
  uuid: 0e4f7662-88d9-4635-a9ac-f6553c5b2000

sync:
  paths:
    - ../../notebooks
    - ../../dist
    - ../../src

include:
  - resources/jobs/*.yml
  - resources/pipelines/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-4cae0bb5-2ca3.cloud.databricks.com
    variables:
      catalog: dev_db
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-4cae0bb5-2ca3.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ravi.kumar@intelegencia.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ravi.kumar@intelegencia.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_db
      schema: prod
    permissions:
      - user_name: ravi.kumar@intelegencia.com
        level: CAN_MANAGE
