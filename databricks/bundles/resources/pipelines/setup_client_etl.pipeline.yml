# The main pipeline for setup_client

resources:
  pipelines:
    setup_client_etl:
      name: setup_client_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: ../../../src/db_nse_streaming

      libraries:
        - glob:
            include: ../../../src/db_nse_streaming/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ../../../
